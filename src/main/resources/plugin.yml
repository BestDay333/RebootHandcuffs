name: RebootHandcuffs
version: ${project.version}
main: com.reboot.handcuffs.RebootHandcuffs
api-version: '26.3'
author: BestDay_
description: RP handcuffs mechanic with persistence, leash physics and restrictions
website: https://github.com/BestDay333

commands:
  cuff:
    description: Заковать игрока в наручники
    usage: /cuff <игрок>
    permission: reboot.admin
    permission-message: У вас нет прав на использование этой команды!
  uncuff:
    description: Снять наручники с игрока (работает и с оффлайн-игроками)
    usage: /uncuff <игрок>
    permission: reboot.admin
    permission-message: У вас нет прав на использование этой команды!
  cuffgive:
    description: Выдать предмет "Наручники"
    usage: /cuffgive [игрок] [количество]
    permission: reboot.admin
    permission-message: У вас нет прав на использование этой команды!
  cufflist:
    description: Показать список закованных игроков
    usage: /cufflist
    permission: reboot.admin
    permission-message: У вас нет прав на использование этой команды!
  cuffreload:
    description: Перезагрузить конфигурацию плагина
    usage: /cuffreload
    permission: reboot.admin
    permission-message: У вас нет прав на использование этой команды!

permissions:
  reboot.judge:
    description: Право использовать предмет наручников
    default: op
  reboot.admin:
    description: Доступ к административным командам плагина
    default: op
