# Настройки Gradle для RebootHandcuffs.

# Скромная память демо-машины/машины без файла подкачки:
# слишком большой -Xmx приводит к os::commit_memory failed (errno=1455).
org.gradle.jvmargs=-Xms64m -Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8

# Кэширование сборки ускоряет повторные запуски.
org.gradle.caching=true

# Не качать тулчейны из сети: JDK 25 должен быть установлен локально
# (скрипты build.ps1 / build.sh сами находят и подставляют JAVA_HOME).
org.gradle.java.installations.auto-download=false
